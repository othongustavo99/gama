services:
  - type: web
    name: frequencia40-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_DEFAULT_MODEL
        value: llama-3.3-70b-versatile
      - key: DATA_DIR
        value: /data
      - key: APP_NAME
        value: Frequencia40-Gamma
