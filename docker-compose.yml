services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  model-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "ollama pull $${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}
      OLLAMA_MODELS: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}
      DATA_DIR: /data
      APP_NAME: Frequencia40-Gamma
      APP_URL: ${APP_URL:-http://localhost:8080}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-1}
      WEB_SEARCH_TIMEOUT: ${WEB_SEARCH_TIMEOUT:-12}
      WEB_SEARCH_MODE: ${WEB_SEARCH_MODE:-aggressive}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - gama_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s

volumes:
  ollama_data:
  gama_data:
